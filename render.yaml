databases:
  - name: pharmacy-db
    plan: free
    databaseName: pharmacy_db
    user: pharmacy_user

services:
  - type: web
    name: pharmacy-management
    env: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn pharm.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pharmacy-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "pharmacy-management.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://pharmacy-management.onrender.com"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
